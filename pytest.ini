[pytest]
testpaths = tests
addopts = -v --tb=short
markers =
    slow: long-running opt-in checks (e.g. proxy idle-timeout probe); deselect with -m "not slow"
    anonymous: needs no credentials (TLS, DNS, autoconfig, greetings, unauth checks)
    read_only: logs in but does not change server state or send mail
    full: sends mail or mutates server state (mailbox or sieve writes, IDLE delivery)
